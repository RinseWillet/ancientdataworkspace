name: Publish landing image

on:
  push:
    branches: [main]
    paths:
      - "deploy/landing-page/**"
      - ".github/workflows/publish-landing.yml"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./deploy/landing-page
          file: ./deploy/landing-page/Dockerfile
          push: true
          tags: |
            rinsedev/rinsewillet-landing:latest
            rinsedev/rinsewillet-landing:${{ github.sha }}
