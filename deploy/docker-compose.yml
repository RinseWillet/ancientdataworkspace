services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    restart: unless-stopped
    mem_limit: 96m
    depends_on:
      - nginx
    networks:
      - webgis-edge

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    mem_limit: 32m
    depends_on:
      - landing
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - webgis-edge

  landing:
    image: rinsedev/rinsewillet-landing:latest
    restart: unless-stopped
    mem_limit: 32m
    networks:
      - webgis-edge

networks:
  webgis-edge:
    external: true
