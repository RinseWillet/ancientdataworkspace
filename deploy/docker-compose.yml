services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    restart: unless-stopped
    depends_on:
      - nginx
    networks:
      - webgis-edge

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - landing
      - ancientdata
      - retrogame
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - webgis-edge

  landing:
    build:
      context: ./landing-page
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - webgis-edge

  ancientdata:
    image: rinsedev/ancientdata:latest
    restart: unless-stopped
    networks:
      - webgis-edge

  retrogame:
    image: rinsedev/retrogameapp:latest
    restart: unless-stopped
    networks:
      - webgis-edge

networks:
  webgis-edge:
    external: true
